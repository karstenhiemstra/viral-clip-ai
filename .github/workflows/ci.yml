name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  secrets:
    name: Secret scan (no API keys in Git)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_secrets.py

  backend:
    name: Backend (lint + tests, SQLite & PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viralclip
          POSTGRES_PASSWORD: viralclip
          POSTGRES_DB: viralclip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U viralclip" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-montserrat
      - name: Install
        run: pip install -e ".[dev,s3]"
      - name: Ruff
        run: ruff check app tests
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://viralclip:viralclip@localhost:5432/viralclip_test
        run: pytest -q
      - name: Migrations are in sync with the models
        env:
          DATABASE_URL: postgresql://viralclip:viralclip@localhost:5432/viralclip_test
        run: |
          python -c "from sqlalchemy import text; from app.db import Base, init_engine; from app import models; e = init_engine(); Base.metadata.drop_all(e); c = e.connect(); c.execute(text('DROP TABLE IF EXISTS alembic_version')); c.commit()"
          python -m app.migrate
          alembic check

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Full stack starts (db, api, worker, web)
        run: |
          printf 'POSTGRES_PASSWORD=first-%s\nAPP_SECRET_KEY=ci\n' "$RANDOM" > .env
          docker compose up -d --wait --wait-timeout 240 db api web
          docker compose up -d worker
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS -o /dev/null http://127.0.0.1:3000/
      - name: Still starts when .env has another database password than the existing database
        run: |
          printf 'POSTGRES_PASSWORD=second-%s\nAPP_SECRET_KEY=ci\n' "$RANDOM" > .env
          docker compose up -d --wait --wait-timeout 240 db api web
          curl -fsS http://127.0.0.1:8000/api/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

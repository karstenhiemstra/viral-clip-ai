# ViralClip AI - full stack: PostgreSQL + API + worker + dashboard.
#   cp .env.example .env   # fill in your keys
#   docker compose up -d --build
#   open http://localhost:3000
name: viralclip

x-backend: &backend
  build:
    context: ./backend
    args:
      INSTALL_LOCAL_WHISPER: ${INSTALL_LOCAL_WHISPER:-false}
  image: viralclip-backend:latest
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-viralclip}:${POSTGRES_PASSWORD:-viralclip}@db:5432/${POSTGRES_DB:-viralclip}
    DATA_DIR: /data
    API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
  volumes:
    - ./data:/data   # storage, inbox folder (data/inbox) and model caches
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viralclip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viralclip}
      POSTGRES_DB: ${POSTGRES_DB:-viralclip}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # An existing database keeps the password it was created with, so a new or changed .env (or starting
    # from another folder) would lock the API out ("password authentication failed" -> "api is
    # unhealthy"). On every start, set the password to POSTGRES_PASSWORD over the container's own local
    # socket; the database stays password-protected on the network and is never published to the host.
    entrypoint:
      - sh
      - -c
      - |
        rm -f /tmp/viralclip-password-synced
        docker-entrypoint.sh postgres &
        pid=$$!
        trap 'kill -INT $$pid' INT
        trap 'kill -TERM $$pid' TERM
        until echo "ALTER ROLE CURRENT_USER WITH PASSWORD :'pw';" | psql -q -v ON_ERROR_STOP=1 -v pw="$$POSTGRES_PASSWORD" -U "$$POSTGRES_USER" -d postgres >/dev/null 2>&1; do
          kill -0 $$pid 2>/dev/null || exit 1
          sleep 1
        done
        touch /tmp/viralclip-password-synced
        status=0
        while kill -0 $$pid 2>/dev/null; do wait $$pid; status=$$?; done
        exit $$status
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viralclip} && test -f /tmp/viralclip-password-synced"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # API docs at http://localhost:8000/docs (not exposed publicly)

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker.runner"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy   # the API runs the database migrations first

  web:
    build: ./frontend
    image: viralclip-web:latest
    environment:
      BACKEND_URL: http://api:8000
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Only reachable from this computer. To open it to your network/internet, set a DASHBOARD_PASSWORD
      # first and change this to "${WEB_PORT:-3000}:3000" (or put a reverse proxy with HTTPS in front).
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
